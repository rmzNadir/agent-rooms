name: Plan prod adopt

on:
  workflow_dispatch:
    inputs:
      adopt:
        description: Take over cloud resources this stage does not own
        type: boolean
        default: false
  push:
    branches:
      - cursor/deploy-adopt-flag-8d00

permissions:
  contents: read

concurrency:
  group: agent-rooms-plan-prod
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ vars.AGENT_ROOMS_GITHUB_ENVIRONMENT }}
    env:
      ALCHEMY_STAGE: ${{ vars.AGENT_ROOMS_STAGE }}
      AGENT_ROOMS_ADMIN_TOKEN: ${{ secrets.AGENT_ROOMS_ADMIN_TOKEN }}
      AGENT_ROOMS_DOMAIN: ${{ vars.AGENT_ROOMS_DOMAIN }}
      AGENT_ROOMS_URL: ${{ secrets.AGENT_ROOMS_URL }}
      AGENT_ROOMS_WORKER_NAME: ${{ secrets.AGENT_ROOMS_WORKER_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # A push of this branch is the dry run of Deploy dispatched with adopt
      # checked. A manual run follows the same input as Deploy, default off.
      - name: Plan the stage the way deploy would
        env:
          AGENT_ROOMS_ADOPT: ${{ (github.event_name == 'push' || inputs.adopt == true) && 'true' || 'false' }}
          AGENT_ROOMS_ALCHEMY_COMMAND: plan
        run: |
          set -o pipefail
          bun scripts/run-stage.ts 2>&1 | bun scripts/show-plan.ts
      - name: Read the pinned script classes
        if: always()
        run: bun scripts/list-script-classes.ts
