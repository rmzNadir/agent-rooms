name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Alchemy Domain pin matches the upstream commit
        run: bun scripts/verify-domain-pin.ts --upstream
      - name: CLAUDE.md stays a symlink
        run: test "$(git ls-files -s CLAUDE.md | awk '{print $1}')" = 120000
      - run: bun run check
      - run: bun run test:conformance
